<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admin-dashboard</title>
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen p-2 sm:p-4">
    <main class="w-full max-w-md bg-slate-850 rounded-lg min-h-[750px] flex flex-col justify-between border border-slate-800 relative text-slate-100 scrollbar-hide shadow-2xl">
        <header class="sticky top-0 z-100 bg-slate-900/80 backdrop-blur-lg text-white p-4 border-b border-slate-800/60 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <a href="index.html" class="w-10 h-10 rounded-xl flex justify-center items-center hover:text-blue-400 hover:bg-slate-800 transition-colors"><i data-lucide="arrow-left"></i></a>
                <div>
                    <h2 class="text-sm font-black uppercase tracking-wider font-white">Admin Dashboard</h2>
                    <p class="text-xs text-emerald-400 font-bold tracking-widest uppercase">Control Matrix</p>
                </div>
            </div>
            <div class="h-10 w-10 bg-gradient-to-tr from-emerald-600 to-emerald-300 rounded-xl flex justify-center items-center"><i data-lucide="shield-check" class="text-white"></i></div>
        </header>
        <div class="flex-1 p-5 space-y-4">

            <div class="grid grid-cols-3 gap-3">
                <div class="bg-slate-900/60 p-3 border border-slate-800">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Present</p>
                    <p class="font-black text-emerald-400 mt-1">15</p>
                </div>

                <div class="bg-slate-900/60 p-3 border border-slate-800">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">absent</p>
                    <p class="font-black text-red-500 mt-1">3</p>
                </div>

                <div class="bg-slate-900/60 p-3 border border-slate-800">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">late</p>
                    <p class="font-black text-amber-500 mt-1">1</p>
                </div>

            </div>
            <div class="bg-slate-900/30 border border-slate-800 rounded-2xl space-x-4">
                <div class="p-2 flex justify-between items-center text-xs font-bold uppercase tracking-wider text-slate-400">
                    <span>Weekly Entry</span>
                    <span class="text-emerald-400">Present: 16/18</span>
                </div>
                <div class="h-17 flex items-end justify-between space-x-2 p-2">
                    <div class="w-full bg-slate-800 rounded-t-sm h-[40%]"></div>
                    <div class="w-full bg-slate-800 rounded-t-sm h-[60%]"></div>
                    <div class="w-full bg-slate-800 rounded-t-sm h-[50%]"></div>
                    <div class="w-full bg-emerald-800 rounded-t-sm h-[85%]"></div>
                    <div class="w-full bg-blue-500 rounded-t-sm h-[75%]"></div>
                </div>
                <div class="w-full bg-slate-900 rounded-full h-2 border border-slate-800">
                    <div class="bg-gradient-to-r from-emerald-700 to-emerald-400 h-2 rounded-full w-[75%]"></div>
                </div>
            </div>
            <div class="space-y-4">
                <div class="flex items-center justify-between p-1">
                    <h4 class="text-xs text-slate-400 font-black uppercase">Staff Attendance</h4>
                    <i data-lucide="sliders-horizontal" class="w-4 h-4 text-slate-300 cursor-pointer hover:text-emerald-400 transition-colors"></i>
                </div>
                <div class="bg-slate-900/50 rounded-2xl border border-slate-800/80 divide-y divide-slate-300 text-xs font-medium shadow-inner">
                    <div class="flex justify-between items-center bg-slate-800/20 p-4">
                        <div class="flex items-center space-x-2">
                            <div class="w-7 h-7 rounded-full bg-slate-800 flex justify-center items-center p-2 text-xs">RM</div>
                            <span class="text-slate-400 font-bold">Rollings Majiwa</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-slate-400 text-xs">07 : 15 AM</span>
                            <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
                        </div>
                    </div>
                    <div class="bg-slate-900/50 rounded-2xl border border-slate-800/80 divide-y divide-slate-300 text-xs font-medium shadow-inner">
                    <div class="flex justify-between items-center bg-slate-800/20 p-4">
                        <div class="flex items-center space-x-2">
                            <div class="w-7 h-7 rounded-full bg-slate-800 flex justify-center items-center p-2 text-xs">JN</div>
                            <span class="text-slate-400 font-bold">John Njenga</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-slate-400 text-xs">08 : 10 AM</span>
                            <i data-lucide="alert-circle" class="w-4 h-4 text-amber-500"></i>
                        </div>
                    </div>
                    <div class="bg-slate-900/50 rounded-2xl border border-slate-800/80 divide-y divide-slate-300 text-xs font-medium shadow-inner">
                    <div class="flex justify-between items-center bg-slate-800/20 p-4">
                        <div class="flex items-center space-x-2">
                            <div class="w-7 h-7 rounded-full bg-slate-800 flex justify-center items-center p-2 text-xs">AM</div>
                            <span class="text-slate-400 font-bold">Alice Maina</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-slate-400 text-xs">Not Clocked In</span>
                            <i data-lucide="alert-circle" class="w-4 h-4 text-red-500"></i>
                        </div>
                    </div>
                    <div class="bg-slate-900/50 rounded-2xl border border-slate-800/80 divide-y divide-slate-300 text-xs font-medium shadow-inner">
                    <div class="flex justify-between items-center bg-slate-800/20 p-4">
                        <div class="flex items-center space-x-2">
                            <div class="w-7 h-7 rounded-full bg-slate-800 flex justify-center items-center p-2 text-xs">PK</div>
                            <span class="text-slate-400 font-bold">Patrick Kamau</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-slate-400 text-xs">07 : 27 AM</span>
                            <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
                        </div>
                    </div>
                </div>

            </div>
            <div class="grid grid-cols-3 gap-2 p-1">
                <button type="submit" class="flex justify-center items-center bg-slate-900/50 space-x-2 hover:bg-slate-600 rounded-xl border border-slate-700 font-bold uppercase p-2">
                     <i data-lucide="users" class="text-emerald-400 h-4 w-4"></i>
                     <span>Present</span>
                </button>
                <button type="submit" class="flex justify-center items-center bg-slate-900/50 space-x-2 hover:bg-slate-600 rounded-xl border border-slate-700 font-bold uppercase p-2">
                     <i data-lucide="log-out" class="text-emerald-400 h-4 w-4"></i>
                     <span>Out logs</span>
                </button>
               <button type="submit" class="flex justify-center items-center bg-slate-900/50 space-x-2 hover:bg-slate-600 rounded-xl border border-slate-700 font-bold uppercase p-2">
                     <i data-lucide="log-in" class="text-emerald-400 h-4 w-4"></i>
                     <span>in logs</span>
                </button>
               
               
            </div>

        </div>
        <footer class="h-6 bg-slate-950 w-full rounded-t-border border border-slate-800/80 bottom-0 sticky z-40"></footer>
    </main>
    <script>
        lucide.createIcons();
    </script>
    
    
</body>
</html>
